name: Hopper Windows focused check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hopper-windows-focused
  cancel-in-progress: true

jobs:
  hopper:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install CUDA 12.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '12.4'
          cuda_arch: x64
      - name: Configure Hopper only
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_CUDA_ARCHITECTURES=90 -DGGML_CUDA_CCCL_VERSION=v3.4.3 -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CPU=OFF -DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_SERVER=OFF -DGGML_CCACHE=OFF
      - name: Compile Hopper kernel only
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build --config Release --target ggml-cuda-sm90 --verbose -j 2
      - name: Print capability probe diagnostics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build/CMakeCache.txt) {
            Select-String -Path build/CMakeCache.txt -Pattern 'GGML_CUDA_MMQ_SM90|CMAKE_CUDA_ARCHITECTURES'
          }
          if (Test-Path build/CMakeFiles/CMakeConfigureLog.yaml) {
            Get-Content build/CMakeFiles/CMakeConfigureLog.yaml
          }
      - name: Save configure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hopper-windows-configure
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
            build/ggml/src/ggml-cuda/sm90-ptx-check.cu
